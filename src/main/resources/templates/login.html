<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logowanie - Generator PESEL</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Generator Numerów PESEL</h1>
        <nav>
          <a href="/" class="nav-link">Strona główna</a>
          <a href="/register" class="nav-link">Rejestracja</a>
          <a href="/login" class="nav-link active">Logowanie</a>
        </nav>
      </header>

      <main>
        <section class="form-section">
          <h2>Logowanie</h2>

          <div th:if="${param.error}" class="alert alert-error">
            Niepoprawny email lub hasło!
          </div>

          <div th:if="${param.success}" class="alert alert-success">
            Rejestracja udana! Możesz się teraz zalogować.
          </div>

          <form th:action="@{/login}" method="post" class="form-container">
            <div class="form-group">
              <label for="username">Email:</label>
              <input
                type="email"
                id="username"
                name="username"
                placeholder="example@gmail.com"
                required
                autofocus
              />
            </div>

            <div class="form-group">
              <label for="password">Hasło:</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Your password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary">Zaloguj się</button>
          </form>

          <p class="auth-link">
            Nie masz konta? <a href="/register">Zarejestruj się tutaj →</a>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
