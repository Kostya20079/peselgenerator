<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rejestracja - Generator PESEL</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Generator Numerów PESEL</h1>
        <nav>
          <a href="/" class="nav-link">Strona główna</a>
          <a href="/register" class="nav-link active">Rejestracja</a>
          <a href="/login" class="nav-link">Logowanie</a>
        </nav>
      </header>

      <main>
        <section class="form-section">
          <h2>Rejestracja nowego konta</h2>

          <div
            th:if="${success}"
            class="alert alert-success"
            th:text="${success}"
          ></div>
          <div
            th:if="${error}"
            class="alert alert-error"
            th:text="${error}"
          ></div>

          <form th:action="@{/register}" method="post" class="form-container">
            <div class="form-group">
              <label for="firstName">Imię:</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Fist name"
                required
              />
            </div>

            <div class="form-group">
              <label for="lastName">Nazwisko:</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Last name"
                required
              />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="password">Hasło:</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="At least 6 signs"
                required
              />
            </div>

            <div class="form-group">
              <label for="confirmPassword">Potwierdź hasło:</label>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Repeat password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary">
              Zarejestruj się
            </button>
          </form>

          <p class="auth-link">
            Masz już konto? <a href="/login">Zaloguj się tutaj →</a>
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
